id = "asumaran.asgotonotes"
name = "asgotonotes"
version = "0.10.0"
min_herdr_version = "0.7.5"
description = "Browse the notes Claude Code wrote, grouped by worktree, and open them in Zed"
platforms = ["linux", "macos"]

[[build]]
command = ["scripts/fetch-binary.sh"]

[[actions]]
id = "open"
title = "Open notes browser"
contexts = ["global"]
command = ["scripts/open-pane.sh"]

[[panes]]
id = "picker"
title = "asgotonotes"
placement = "popup"
width = "85%"
height = "90%"
command = ["./asgotonotes"]
